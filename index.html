<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="description" content="A little library of moments, kept by us.">
  <title>Us, in Frames — a little photo library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--paper:#f6f4ef;--ink:#282720;--muted:#77756c;--line:#dedbd2;--accent:#8b6f58;--white:#fffefa}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
    button{font:inherit}header{max-width:1500px;margin:auto;padding:27px 5.5vw 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
    .brand{font:600 21px 'Playfair Display',serif;letter-spacing:-.4px}.brand em{font-weight:500;color:var(--accent)}.top-note,.eyebrow,.count{color:var(--muted);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
    main{max-width:1500px;margin:auto;padding:62px 5.5vw 90px}.intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px}h1{font:500 clamp(42px,6vw,72px)/1.06 'Playfair Display',serif;letter-spacing:-1.7px;margin:9px 0 12px}.subtitle{font:italic 18px 'Playfair Display',serif;color:var(--muted);margin:0}.actions{display:flex;align-items:center;gap:18px;padding-bottom:5px}.count{letter-spacing:.06em;text-transform:none;font-size:12px}.add-button{background:var(--ink);color:var(--paper);border:1px solid var(--ink);padding:13px 19px;font-size:12px;letter-spacing:.04em;cursor:pointer;transition:background .2s,color .2s}.add-button:hover{background:transparent;color:var(--ink)}.add-button:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}#fileInput{display:none}
    .gallery{columns:3 250px;column-gap:24px}.photo{break-inside:avoid;margin:0 0 29px;cursor:zoom-in}.photo img{display:block;width:100%;height:auto;background:#e8e4db;transition:opacity .2s}.photo:hover img{opacity:.94}.caption{font:14px/1.5 'Playfair Display',serif;color:#55534b;margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;padding:100px 20px;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14px}.empty strong{display:block;color:var(--ink);font:500 31px 'Playfair Display',serif;margin-bottom:10px}.empty button{display:block;margin:22px auto 0;background:none;border:0;border-bottom:1px solid var(--accent);color:var(--accent);padding:0 0 4px;cursor:pointer}
    footer{max-width:1500px;margin:auto;border-top:1px solid var(--line);padding:23px 5.5vw 29px;color:#96938a;font-size:10px;letter-spacing:.14em;text-align:center}
    .viewer{position:fixed;inset:0;background:rgba(25,24,21,.96);display:none;align-items:center;justify-content:center;padding:62px 24px 30px;z-index:10}.viewer.open{display:flex}.viewer-content{max-width:min(100%,1200px);max-height:100%;display:flex;flex-direction:column;align-items:center;gap:15px}.viewer img{display:block;max-width:100%;max-height:70vh;object-fit:contain}.viewer-caption{color:#f3f0e9;text-align:center;font:16px/1.5 'Playfair Display',serif;max-width:720px;white-space:pre-wrap}.viewer-actions{display:flex;gap:20px}.viewer-actions button,.close-viewer{border:0;border-bottom:1px solid #777;background:transparent;color:#f3f0e9;padding:7px 0;font-size:12px;cursor:pointer}.viewer-actions button:hover{color:#d7bba1}.close-viewer{position:absolute;top:19px;right:26px;border:0;font-size:25px;line-height:1;padding:5px}.caption-dialog{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,20,18,.48);z-index:20;padding:20px}.caption-dialog.open{display:flex}.dialog-box{background:var(--paper);width:min(100%,460px);padding:28px}.dialog-box h2{font:500 27px 'Playfair Display',serif;margin:0 0 17px}textarea{width:100%;min-height:120px;resize:vertical;padding:12px;border:1px solid var(--line);background:var(--white);font:14px/1.5 'DM Sans',sans-serif;outline-color:var(--accent)}.dialog-actions{display:flex;justify-content:flex-end;gap:16px;margin-top:17px}.dialog-actions button{padding:8px 0;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;font-size:12px}.dialog-actions .save{background:var(--ink);color:white;padding:10px 15px;border:1px solid var(--ink)}.status{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:12px;z-index:30;display:none}.status.show{display:block}
    @media(max-width:650px){header{padding:21px 6vw}.top-note{display:none}main{padding:42px 6vw 64px}.intro{align-items:flex-start;flex-direction:column;margin-bottom:29px}.actions{width:100%;justify-content:space-between}.gallery{columns:2 135px;column-gap:13px}.photo{margin-bottom:19px}.caption{font-size:13px;margin-top:7px}.empty{padding:75px 15px}.viewer{padding:58px 14px 22px}.viewer img{max-height:67vh}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header><div class="brand">Us, <em>in Frames.</em></div><div class="top-note">a little library of moments</div></header>
  <main>
    <section class="intro" aria-labelledby="page-title"><div><p class="eyebrow">Our photo library</p><h1 id="page-title">The moments<br>we keep.</h1><p class="subtitle">A small collection of days that feel like us.</p></div><div class="actions"><span class="count" id="photoCount">0 photographs</span><button class="add-button" id="addPhotos" type="button">＋ &nbsp;Add photographs</button></div></section>
    <input id="fileInput" type="file" accept="image/*" multiple aria-label="Choose photographs">
    <section id="gallery" class="gallery" aria-live="polite" aria-label="Photo gallery"></section>
  </main>
  <footer>JUST OUR MOMENTS, KEPT HERE.</footer>
  <div class="viewer" id="viewer" aria-modal="true" role="dialog" aria-label="Photograph viewer"><button class="close-viewer" id="closeViewer" aria-label="Close viewer" type="button">×</button><div class="viewer-content"><img id="viewerImage" alt="Selected photograph"><div class="viewer-caption" id="viewerCaption"></div><div class="viewer-actions"><button id="editCaption" type="button">Edit caption</button><button id="deletePhoto" type="button">Delete photograph</button></div></div></div>
  <div class="caption-dialog" id="captionDialog" aria-modal="true" role="dialog" aria-labelledby="captionTitle"><div class="dialog-box"><h2 id="captionTitle">A note for this moment</h2><textarea id="captionInput" maxlength="500" placeholder="Write a little note…"></textarea><div class="dialog-actions"><button id="cancelCaption" type="button">Cancel</button><button class="save" id="saveCaption" type="button">Save caption</button></div></div></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      'use strict';
      const DB_NAME='us-in-frames'; const DB_VERSION=1; const STORE='photos';
      let db; let photos=[]; let selectedId=null; let previousFocus=null; const imageUrls=new Map();
      const $=id=>document.getElementById(id);
      const gallery=$('gallery'),fileInput=$('fileInput'),viewer=$('viewer'),captionDialog=$('captionDialog'),captionInput=$('captionInput');
      function openDatabase(){return new Promise((resolve,reject)=>{const request=indexedDB.open(DB_NAME,DB_VERSION);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(STORE))request.result.createObjectStore(STORE,{keyPath:'id'});};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});}
      function transaction(mode,operation){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,mode);let result;operation(tx.objectStore(STORE),value=>result=value);tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Storage operation was interrupted'));});}
      const getAll=()=>transaction('readonly',(store,set)=>{const req=store.getAll();req.onsuccess=()=>set(req.result);});
      const put=photo=>transaction('readwrite',store=>store.put(photo));
      const remove=id=>transaction('readwrite',store=>store.delete(id));
      function imageUrl(photo){let url=imageUrls.get(photo.id);if(!url){const blob=photo.image instanceof Blob?photo.image:photo.image?.blob;if(!(blob instanceof Blob))throw new TypeError('Stored photograph data is not a Blob');url=URL.createObjectURL(blob);imageUrls.set(photo.id,url);}return url;}
      function revokeImageUrl(id){const url=imageUrls.get(id);if(url){URL.revokeObjectURL(url);imageUrls.delete(id);}}
      function flash(message){const node=$('status');node.textContent=message;node.classList.add('show');clearTimeout(flash.timer);flash.timer=setTimeout(()=>node.classList.remove('show'),2600);}
      function render(){gallery.replaceChildren();$('photoCount').textContent=`${photos.length} ${photos.length===1?'photograph':'photographs'}`;if(!photos.length){const empty=document.createElement('div');empty.className='empty';const title=document.createElement('strong');title.textContent='Your story starts here.';const copy=document.createTextNode('Add the photographs you want to keep close.');const add=document.createElement('button');add.textContent='Choose photographs';add.type='button';add.addEventListener('click',()=>fileInput.click());empty.append(title,copy,add);gallery.append(empty);return;}photos.sort((a,b)=>b.createdAt-a.createdAt).forEach(photo=>{const item=document.createElement('figure');item.className='photo';const img=document.createElement('img');try{img.src=imageUrl(photo);}catch(error){console.error(`Could not render photograph ${photo.id}`,error);return;}img.alt=photo.caption||'Saved photograph';img.loading='lazy';img.addEventListener('error',()=>{console.error(`Image preview failed for ${photo.id}`);img.alt='Photograph could not be decoded';},{once:true});const caption=document.createElement('figcaption');caption.className='caption';caption.textContent=photo.caption||'';item.append(img,caption);item.addEventListener('click',()=>openViewer(photo.id,item));gallery.append(item);});}
      function openViewer(id,focus){selectedId=id;previousFocus=focus||document.activeElement;const photo=photos.find(p=>p.id===id);if(!photo)return;try{$('viewerImage').src=imageUrl(photo);}catch(error){console.error(error);flash('This photograph could not be opened.');return;}$('viewerImage').alt=photo.caption||'Selected photograph';$('viewerCaption').textContent=photo.caption||'No caption yet.';viewer.classList.add('open');document.body.style.overflow='hidden';$('closeViewer').focus();}
      function closeViewer(){viewer.classList.remove('open');document.body.style.overflow='';selectedId=null;if(previousFocus?.isConnected)previousFocus.focus();}
      function openCaption(){const photo=photos.find(p=>p.id===selectedId);if(!photo)return;captionInput.value=photo.caption||'';captionDialog.classList.add('open');captionInput.focus();}
      $('addPhotos').addEventListener('click',()=>fileInput.click());
      fileInput.addEventListener('change',async event=>{const files=[...event.target.files].filter(file=>file.type.startsWith('image/'));if(!files.length)return;const button=$('addPhotos');button.disabled=true;button.textContent='Saving photographs…';try{for(const file of files){const image=file.slice(0,file.size,file.type);await put({id:crypto.randomUUID(),image,caption:'',createdAt:Date.now()+Math.random()});}photos=await getAll();render();flash(`${files.length} ${files.length===1?'photograph':'photographs'} added.`);}catch(error){console.error(error);flash('Could not save photographs. Check available browser storage.');}finally{button.disabled=false;button.innerHTML='＋ &nbsp;Add photographs';fileInput.value='';}});
      $('closeViewer').addEventListener('click',closeViewer);viewer.addEventListener('click',event=>{if(event.target===viewer)closeViewer();});$('editCaption').addEventListener('click',openCaption);
      $('cancelCaption').addEventListener('click',()=>captionDialog.classList.remove('open'));captionDialog.addEventListener('click',event=>{if(event.target===captionDialog)captionDialog.classList.remove('open');});
      $('saveCaption').addEventListener('click',async()=>{const photo=photos.find(p=>p.id===selectedId);if(!photo)return;photo.caption=captionInput.value.trim();try{await put(photo);render();$('viewerCaption').textContent=photo.caption||'No caption yet.';$('viewerImage').alt=photo.caption||'Selected photograph';captionDialog.classList.remove('open');$('editCaption').focus();}catch(error){console.error(error);flash('Could not save this caption.');}});
      $('deletePhoto').addEventListener('click',async()=>{if(!selectedId)return;const id=selectedId;try{await remove(id);revokeImageUrl(id);photos=photos.filter(p=>p.id!==id);render();closeViewer();$('viewerImage').removeAttribute('src');flash('Photograph deleted.');}catch(error){console.error(error);flash('Could not delete this photograph.');}});
      window.addEventListener('beforeunload',()=>{for(const url of imageUrls.values())URL.revokeObjectURL(url);imageUrls.clear();});
      document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(captionDialog.classList.contains('open')){captionDialog.classList.remove('open');$('editCaption').focus();}else if(viewer.classList.contains('open'))closeViewer();}});
      (async()=>{try{if(!('indexedDB'in window))throw new Error('IndexedDB is unavailable');db=await openDatabase();photos=await getAll();render();}catch(error){console.error(error);gallery.innerHTML='<div class="empty"><strong>Library unavailable.</strong>This browser could not open local photo storage.</div>';flash('Please open this library in a modern browser.');}})();
    })();
  </script>
</body>
</html>
